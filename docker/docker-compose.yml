version: "3.9"

services:

  # ── PostGIS database ──────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: city3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       city3d
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d city3d"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Node.js API server ────────────────────────────────────────────────────
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: city3d-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     city3d
      DB_USER:     postgres
      DB_PASSWORD: postgres
      PORT:        3000
      NODE_ENV:    production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python generator (run-once) ───────────────────────────────────────────
  generator:
    build:
      context: ../generator
      dockerfile: Dockerfile
    container_name: city3d-generator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     city3d
      DB_USER:     postgres
      DB_PASSWORD: postgres
    command: >
      python main.py
        --lod 4
        --buildings 200
        --write-db
        --no-viewer
        --geojson /output/city.geojson
    volumes:
      - generator_output:/output
    restart: "no"

volumes:
  postgres_data:
  generator_output:
