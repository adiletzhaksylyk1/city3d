<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Visual Map Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a14;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    /* ── HUD overlay ── */
    #hud {
      position: fixed;
      top: 16px; left: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }

    .hud-panel {
      background: rgba(10, 10, 20, 0.82);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      padding: 12px 16px;
      backdrop-filter: blur(6px);
      pointer-events: all;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #90caf9;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .hud-stat {
      font-size: 12px;
      color: #b0bec5;
      line-height: 1.8;
    }

    .hud-stat span {
      color: #e0e0e0;
      font-weight: 500;
    }

    /* ── LOD selector ── */
    #lod-selector label {
      font-size: 12px;
      color: #b0bec5;
      margin-bottom: 4px;
      display: block;
    }

    #lod-select {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      color: #e0e0e0;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    #lod-select:focus { outline: none; border-color: #90caf9; }

    /* ── Loading overlay ── */
    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-size: 22px;
      font-weight: 600;
      color: #90caf9;
      letter-spacing: 0.06em;
    }

    .loading-sub {
      font-size: 13px;
      color: #78909c;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(144,202,249,0.2);
      border-top-color: #90caf9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Info panel (click on building) ── */
    #info-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 220px;
      background: rgba(10, 10, 20, 0.90);
      border: 1px solid rgba(144,202,249,0.25);
      border-radius: 10px;
      padding: 14px 16px;
      backdrop-filter: blur(8px);
      z-index: 10;
      display: none;
      font-size: 12px;
    }

    #info-panel.visible { display: block; }
    #info-panel .info-title { color: #90caf9; font-weight: 600; margin-bottom: 8px; font-size: 13px; }
    #info-panel .info-row { display: flex; justify-content: space-between; color: #b0bec5; line-height: 1.9; }
    #info-panel .info-row span { color: #e0e0e0; }

    /* ── Controls help ── */
    #controls-help {
      position: fixed;
      bottom: 20px;
      left: 16px;
      font-size: 11px;
      color: #546e7a;
      line-height: 1.8;
      pointer-events: none;
    }

    /* ── Source mode toggle ── */
    #source-toggle {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .src-btn {
      flex: 1;
      padding: 4px 0;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #b0bec5;
      cursor: pointer;
      text-align: center;
    }

    .src-btn.active {
      background: rgba(144,202,249,0.18);
      border-color: #90caf9;
      color: #90caf9;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-title">3D Visual Map Generator</div>
  <div class="loading-sub" id="loading-msg">Initialising scene…</div>
</div>

<div id="canvas-container"></div>

<!-- HUD -->
<div id="hud">

  <div class="hud-panel">
    <div class="hud-title">3D City Visualiser</div>
    <div class="hud-stat">Buildings: <span id="stat-buildings">—</span></div>
    <div class="hud-stat">Streets:   <span id="stat-streets">—</span></div>
    <div class="hud-stat">FPS:       <span id="stat-fps">—</span></div>
    <div class="hud-stat">LOD tier:  <span id="stat-lod">—</span></div>
  </div>

  <div class="hud-panel" id="lod-selector">
    <label for="lod-select">Data LOD level</label>
    <select id="lod-select">
      <option value="">All levels</option>
      <option value="0">0 — Flat footprints</option>
      <option value="1">1 — Basic extrusion</option>
      <option value="2" selected>2 — Standard</option>
      <option value="3">3 — Detailed</option>
      <option value="4">4 — Maximum (streets)</option>
    </select>

    <div id="source-toggle" style="margin-top:10px;">
      <div class="hud-stat" style="margin-bottom:4px">Data source:</div>
      <div style="display:flex;gap:6px;">
        <button class="src-btn active" id="btn-geojson">GeoJSON</button>
        <button class="src-btn"        id="btn-api">Live API</button>
      </div>
    </div>
  </div>

</div>

<!-- Building info panel -->
<div id="info-panel">
  <div class="info-title">🏢 Building</div>
  <div class="info-row">Height   <span id="info-height">—</span></div>
  <div class="info-row">Floors   <span id="info-floors">—</span></div>
  <div class="info-row">Material <span id="info-material">—</span></div>
  <div class="info-row">Type     <span id="info-type">—</span></div>
  <div class="info-row">Roof     <span id="info-roof">—</span></div>
  <div class="info-row">LOD      <span id="info-lod">—</span></div>
</div>

<div id="controls-help">
  Orbit: left-drag &nbsp;|&nbsp; Pan: right-drag &nbsp;|&nbsp; Zoom: scroll &nbsp;|&nbsp; Click: building info
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
